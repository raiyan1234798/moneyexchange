name = "unimoni-video-upload"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Set your public playback base URL (custom domain or r2.dev)
[vars]
R2_PUBLIC_URL = "https://pub-REPLACE.r2.dev"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "unimoni-videos"

# FIREBASE_API_KEY — set via: npx wrangler secret put FIREBASE_API_KEY
