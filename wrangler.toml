# Cloudflare Pages — Git-connected build (root directory = repo root).
#
# The app lives in web/. The root `npm run build` builds it and emits the
# static export to web/out, so Pages must look there for the deploy output.
# (The dashboard "Build output directory" defaults to `out` at the repo root,
# which does not exist — this file overrides it.)
#
# The repo-root functions/ dir is FIREBASE Cloud Functions, not Cloudflare
# Pages Functions; Pages logs a harmless "No routes found … Skipping" for it.
name = "unimoni"
pages_build_output_dir = "web/out"
# Required for /api/upload: without a modern compatibility date the Workers
# runtime parses multipart FILE parts as plain strings and uploads fail with
# "Missing file field".
compatibility_date = "2024-12-01"

# R2 for video/image uploads, handled by web/public/_worker.js at /api/upload.
# Binding the bucket here activates R2 on deploy (no dashboard step). If the
# bucket name differs, uploads fail cleanly and the app falls back to Firestore.
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "unimoni"

[vars]
R2_PUBLIC_URL = "https://pub-ad5465971a1b41bdb06b0b0d3dc8aa1f.r2.dev"

# Workers AI — powers /api/ocr-rates (photo of a rate board → structured rates).
[ai]
binding = "AI"
